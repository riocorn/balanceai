<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 480 540" xmlns="http://www.w3.org/2000/svg" id="svg-pharmacy-hero">
<title>Order to delivery, animated</title>
<style>
.float{animation:bob 5s ease-in-out infinite}
.float.d1{animation-delay:-1.2s}.float.d2{animation-delay:-2.4s}.float.d3{animation-delay:-3.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.tick{stroke-dasharray:26;stroke-dashoffset:26;animation:tick 3s ease-in-out infinite}
@keyframes tick{0%,10%{stroke-dashoffset:26}30%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:26}}
.progress{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:prog 4s ease-in-out infinite}
@keyframes prog{0%,15%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.ring.r2{animation-delay:-1.2s}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.drive{animation:drive 5s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
.t{font-family:sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tick{stroke-dashoffset:0}.progress{transform:scaleX(1)}}
</style>

<path d="M240 40 C 360 30 450 130 445 260 C 440 400 350 480 235 478 C 120 476 40 390 45 255 C 50 130 130 50 240 40 Z" fill="#ffffff" opacity="0.05"/>

<g stroke-linecap="round" fill="none">
  <g class="twinkle" stroke="#ffffff" stroke-width="3" opacity="0.5"><path d="M36 120 H52 M44 112 V128"/></g>
  <g class="twinkle" stroke="#C98A2C" stroke-width="3" style="animation-delay:-1s"><path d="M420 90 H436 M428 82 V98"/></g>
  <g class="twinkle" stroke="#ffffff" stroke-width="3" opacity="0.4" style="animation-delay:-2s"><path d="M30 440 H46 M38 432 V448"/></g>
</g>

<!-- floating pharmacy-verified cross badge, upper-left -->
<g class="float d1">
  <circle cx="86" cy="110" r="46" fill="#0F3D2E"/>
  <g class="pulse">
    <line x1="86" y1="90" x2="86" y2="130" stroke="#C98A2C" stroke-width="7" stroke-linecap="round"/>
    <line x1="66" y1="110" x2="106" y2="110" stroke="#C98A2C" stroke-width="7" stroke-linecap="round"/>
  </g>
</g>

<!-- floating delivery package badge, upper-right -->
<g class="float d2">
  <circle cx="404" cy="108" r="50" fill="#0F3D2E"/>
  <g class="drive">
    <rect x="380" y="90" width="48" height="36" rx="5" fill="#5B6EE1"/>
    <path d="M386,90 L396,78 L412,78 L422,90" fill="none" stroke="#5B6EE1" stroke-width="4" stroke-linejoin="round"/>
    <line x1="380" y1="104" x2="428" y2="104" stroke="#0F3D2E" stroke-width="2.5"/>
  </g>
</g>

<!-- phone mockup: the real order flow -->
<g class="float">
  <rect x="140" y="150" width="200" height="360" rx="34" fill="#0F3D2E"/>
  <rect x="150" y="162" width="180" height="336" rx="24" fill="#ffffff"/>
  <rect x="216" y="168" width="48" height="7" rx="3.5" fill="#0F3D2E"/>

  <rect x="164" y="188" width="152" height="30" rx="15" fill="#F5EDE0"/>
  <circle cx="178" cy="203" r="3" fill="#1D5C3D"/>
  <text class="t" x="190" y="207" font-size="10" fill="#5B7480">Search medicines</text>

  <rect x="164" y="230" width="152" height="70" rx="14" fill="#F1F9F5"/>
  <rect x="176" y="242" width="30" height="30" rx="6" fill="#E0475A"/>
  <rect x="176" y="242" width="15" height="30" rx="0" fill="#ffffff"/>
  <text class="t" x="214" y="253" font-size="9.5" font-weight="700" fill="#1D5C3D">Prochlorperazine</text>
  <text class="t" x="214" y="266" font-size="8.5" fill="#5B7480">Symptom relief</text>
  <rect x="214" y="274" width="42" height="16" rx="8" fill="#C98A2C"/>
  <text class="t" x="235" y="286" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">82%</text>

  <rect x="164" y="312" width="152" height="52" rx="14" fill="#0F3D2E"/>
  <circle cx="186" cy="338" r="12" fill="#25D366"/>
  <path d="M180,338 L184,343 L193,332" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="204" y="335" font-size="9.5" font-weight="700" fill="#ffffff">Sent to WhatsApp</text>
  <text class="t" x="204" y="349" font-size="8.5" fill="#9FC2AE">Doctor review — beta</text>

  <rect x="164" y="376" width="152" height="100" rx="16" fill="#F1F9F5"/>
  <circle cx="188" cy="404" r="14" fill="#1D5C3D"/>
  <path class="tick" d="M181,404 L186,410 L196,396" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="210" y="401" font-size="10" font-weight="700" fill="#1D5C3D">Order confirmed</text>
  <text class="t" x="210" y="415" font-size="8.5" fill="#5B7480">Arrives in 30 min</text>
  <rect x="176" y="434" width="128" height="7" rx="3.5" fill="#DCECE0"/>
  <rect class="progress" x="176" y="434" width="128" height="7" rx="3.5" fill="#2F9E5B"/>
  <text class="t" x="176" y="460" font-size="8.5" fill="#5B7480">Packed</text>
  <text class="t" x="304" y="460" font-size="8.5" fill="#5B7480" text-anchor="end">Home</text>
</g>

<!-- floating medicine capsule, lower-left -->
<g class="float d3">
  <g transform="translate(70 420) rotate(-24)">
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#0F3D2E"/>
    <rect x="-36" y="-12" width="34" height="24" rx="12" fill="#C98A2C"/>
    <rect x="-2" y="-12" width="34" height="24" rx="12" fill="#ffffff"/>
  </g>
  <circle class="ring" cx="70" cy="420" r="44" fill="none" stroke="#C98A2C" stroke-width="2" opacity="0.5"/>
  <circle class="ring r2" cx="70" cy="420" r="44" fill="none" stroke="#C98A2C" stroke-width="2" opacity="0.5"/>
</g>

<!-- floating verified badge, lower-right -->
<g class="float d2">
  <rect x="374" y="392" width="90" height="46" rx="14" fill="#0F3D2E"/>
  <circle cx="396" cy="415" r="11" fill="#7C5CBF"/>
  <path class="tick" d="M390,415 L394,420 L403,409" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="412" y="412" font-size="8.5" font-weight="700" fill="#ffffff">100%</text>
  <text class="t" x="412" y="423" font-size="8.5" font-weight="700" fill="#ffffff">genuine</text>
</g>
</svg>
