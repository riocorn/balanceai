<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 480 480"
   version="1.1"
   id="svg-pharmacy-hero"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs-ph">
    <linearGradient
       id="badgeGradientPharmacy"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#0E7C86"
         id="ph-stop1" />
      <stop
         offset="1"
         stop-color="#1E6FD9"
         id="ph-stop2" />
    </linearGradient>
  </defs>
  <!-- decorative texture dots -->
  <circle
     cx="40"
     cy="80"
     r="4"
     fill="#ffffff"
     opacity="0.35"
     id="circle6" />
  <circle
     cx="60"
     cy="410"
     r="5"
     fill="#ffffff"
     opacity="0.3"
     id="circle8" />
  <circle
     cx="440"
     cy="90"
     r="4"
     fill="#ffffff"
     opacity="0.3"
     id="circle10" />
  <circle
     cx="418"
     cy="400"
     r="3.5"
     fill="#ffffff"
     opacity="0.3"
     id="circle12" />
  <!-- shopping bag: order placed -->
  <path
     d="M100,150 L120,110 H196 L216,150 Z"
     fill="none"
     stroke="#ffffff"
     stroke-width="4"
     stroke-linejoin="round"
     id="path14" />
  <path
     d="M100,150 H216 L206,268 Q204,282 190,282 H126 Q112,282 110,268 Z"
     fill="#ffffff"
     id="path16" />
  <path
     d="M136,150 V128 Q136,104 158,104 Q180,104 180,128 V150"
     fill="none"
     stroke="#0E7C86"
     stroke-width="8"
     stroke-linecap="round"
     id="path18" />
  <!-- item-count badge on bag -->
  <circle
     cx="205"
     cy="128"
     r="17"
     fill="#E0475A"
     id="circle20" />
  <text
     x="205"
     y="133"
     text-anchor="middle"
     font-family="sans-serif"
     font-size="16"
     font-weight="700"
     fill="#ffffff"
     id="text22">3</text>
  <!-- connector: bag to pharmacy badge -->
  <path
     d="M226,170 Q286,170 320,168"
     stroke="#ffffff"
     stroke-width="3"
     stroke-dasharray="2 9"
     stroke-linecap="round"
     fill="none"
     opacity="0.85"
     id="path24" />
  <!-- pharmacy-verified badge -->
  <circle
     cx="366"
     cy="168"
     r="50"
     fill="url(#badgeGradientPharmacy)"
     id="circle26" />
  <path
     d="M366,140 V196 M338,168 H394"
     stroke="#ffffff"
     stroke-width="10"
     stroke-linecap="round"
     id="path28" />
  <!-- connector: badge to package -->
  <path
     d="M348,214 Q300,268 262,316"
     stroke="#ffffff"
     stroke-width="3"
     stroke-dasharray="2 9"
     stroke-linecap="round"
     fill="none"
     opacity="0.85"
     id="path30" />
  <!-- delivered package -->
  <g
     id="g42">
    <rect
       x="150"
       y="330"
       width="120"
       height="96"
       rx="10"
       fill="#ffffff"
       id="rect32" />
    <path
       d="M150,354 H270"
       stroke="#0E7C86"
       stroke-width="6"
       id="path34" />
    <path
       d="M198,330 L210,354 L222,330"
       fill="none"
       stroke="#0E7C86"
       stroke-width="4"
       stroke-linejoin="round"
       id="path36" />
    <!-- delivered checkmark -->
    <circle
       cx="252"
       cy="410"
       r="24"
       fill="#1FAE7A"
       id="circle38" />
    <path
       d="M241,410 L249,419 L264,400"
       fill="none"
       stroke="#ffffff"
       stroke-width="5"
       stroke-linecap="round"
       stroke-linejoin="round"
       id="path40" />
  </g>
</svg>
