<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 240 200"
   version="1.1"
   id="svg-empty-cart"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs-ec">
    <linearGradient
       id="badgeGradientEmptyCart"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#0E7C86"
         id="ec-stop1" />
      <stop
         offset="1"
         stop-color="#1E6FD9"
         id="ec-stop2" />
    </linearGradient>
  </defs>
  <!-- decorative texture dots, light -->
  <circle
     cx="24"
     cy="30"
     r="3"
     fill="#0A5259"
     opacity="0.12"
     id="circle6" />
  <circle
     cx="216"
     cy="150"
     r="3.5"
     fill="#0A5259"
     opacity="0.12"
     id="circle8" />
  <circle
     cx="206"
     cy="34"
     r="2.5"
     fill="#0A5259"
     opacity="0.12"
     id="circle10" />
  <!-- empty shopping bag, resting open — neutral posture, not sad -->
  <path
     d="M62,84 L76,52 H144 L158,84 Z"
     fill="none"
     stroke="#0A5259"
     stroke-width="3.4"
     stroke-linejoin="round"
     opacity="0.85"
     id="path12" />
  <path
     d="M62,84 H158 L150,168 Q149,178 138,178 H82 Q71,178 70,168 Z"
     fill="#EEF3F5"
     stroke="#0A5259"
     stroke-width="3"
     opacity="0.9"
     id="path14" />
  <path
     d="M90,84 V68 Q90,50 110,50 Q130,50 130,68 V84"
     fill="none"
     stroke="#0E7C86"
     stroke-width="6"
     stroke-linecap="round"
     opacity="0.85"
     id="path16" />
  <!-- faint fold line, suggests the bag is soft/empty rather than boxy -->
  <path
     d="M80,110 Q110,118 140,110"
     fill="none"
     stroke="#0A5259"
     stroke-width="2"
     opacity="0.14"
     id="path18" />
  <!-- connector hinting at what will appear here once you add a medicine -->
  <path
     d="M170,78 Q192,66 206,50"
     stroke="#0A5259"
     stroke-width="2.4"
     stroke-dasharray="2 8"
     stroke-linecap="round"
     fill="none"
     opacity="0.35"
     id="path20" />
  <!-- ghost capsule outline — an outline only, not a filled shape, since
       nothing has been added yet -->
  <g
     transform="rotate(-28 212 34)"
     opacity="0.45"
     id="g26">
    <rect
       x="192"
       y="22"
       width="40"
       height="20"
       rx="10"
       fill="none"
       stroke="url(#badgeGradientEmptyCart)"
       stroke-width="2.6"
       id="rect22" />
    <line
       x1="212"
       y1="22"
       x2="212"
       y2="42"
       stroke="url(#badgeGradientEmptyCart)"
       stroke-width="2.6"
       id="line24" />
  </g>
</svg>
