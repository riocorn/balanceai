<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 480 540" xmlns="http://www.w3.org/2000/svg" id="svg-symptom-hero">
<title>Symptom to treatment, animated</title>
<style>
.float{animation:bob 5s ease-in-out infinite}
.float.d1{animation-delay:-1.2s}.float.d2{animation-delay:-2.4s}.float.d3{animation-delay:-3.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.16)}30%{transform:scale(1)}42%{transform:scale(1.08)}}
.ecg{stroke-dasharray:120;stroke-dashoffset:120;animation:ecg 2.6s linear infinite}
@keyframes ecg{0%{stroke-dashoffset:120}70%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
.tick{stroke-dasharray:26;stroke-dashoffset:26;animation:tick 3s ease-in-out infinite}
@keyframes tick{0%,10%{stroke-dashoffset:26}30%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:26}}
.progress{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:prog 4s ease-in-out infinite}
@keyframes prog{0%,15%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.ring.r2{animation-delay:-1.2s}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.t{font-family:sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ecg{stroke-dashoffset:0}.tick{stroke-dashoffset:0}.progress{transform:scaleX(1)}}
</style>

<!-- soft depth blob behind everything -->
<path d="M240 40 C 360 30 450 130 445 260 C 440 400 350 480 235 478 C 120 476 40 390 45 255 C 50 130 130 50 240 40 Z" fill="#ffffff" opacity="0.05"/>

<g stroke-linecap="round" fill="none">
  <g class="twinkle" stroke="#ffffff" stroke-width="3" opacity="0.5"><path d="M36 120 H52 M44 112 V128"/></g>
  <g class="twinkle" stroke="#C98A2C" stroke-width="3" style="animation-delay:-1s"><path d="M420 90 H436 M428 82 V98"/></g>
  <g class="twinkle" stroke="#ffffff" stroke-width="3" opacity="0.4" style="animation-delay:-2s"><path d="M30 440 H46 M38 432 V448"/></g>
</g>

<!-- floating heart + ECG badge, upper-left -->
<g class="float d1">
  <circle cx="86" cy="110" r="46" fill="#0F3D2E"/>
  <path class="beat" d="M86 132 C 58 112 66 84 86 96 C 106 84 114 112 86 132 Z" fill="#E0475A"/>
</g>
<path class="ecg" d="M40 168 H70 L78 150 L90 186 L100 140 L110 168 H150" fill="none" stroke="#E0475A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<!-- floating stethoscope badge, upper-right -->
<g class="float d2">
  <circle cx="404" cy="108" r="50" fill="#0F3D2E"/>
  <circle cx="388" cy="90" r="8" fill="#2F9E5B"/>
  <circle cx="420" cy="90" r="8" fill="#2F9E5B"/>
  <path d="M388,98 Q388,124 404,132 Q420,124 420,98" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="404" y1="132" x2="404" y2="146" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="404" cy="152" r="9" fill="#ffffff"/>
</g>

<!-- phone mockup, centered, the real product flow -->
<g class="float">
  <rect x="140" y="150" width="200" height="360" rx="34" fill="#0F3D2E"/>
  <rect x="150" y="162" width="180" height="336" rx="24" fill="#ffffff"/>
  <rect x="216" y="168" width="48" height="7" rx="3.5" fill="#0F3D2E"/>

  <!-- search / describe input -->
  <rect x="164" y="188" width="152" height="30" rx="15" fill="#F5EDE0"/>
  <circle cx="178" cy="203" r="3" fill="#1D5C3D"/>
  <text class="t" x="190" y="207" font-size="10" fill="#5B7480">mujhe migraine hai...</text>

  <!-- matched result card -->
  <rect x="164" y="230" width="152" height="96" rx="14" fill="#F1F9F5"/>
  <circle cx="184" cy="254" r="12" fill="#1D5C3D"/>
  <path d="M178,254 L182,259 L191,248" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="204" y="251" font-size="10" font-weight="700" fill="#1D5C3D">Matched: Migraine</text>
  <text class="t" x="204" y="264" font-size="8.5" fill="#5B7480">9 real treatments found</text>
  <rect x="176" y="278" width="128" height="6" rx="3" fill="#DCECE0"/>
  <rect x="176" y="290" width="90" height="6" rx="3" fill="#E7EFE7"/>
  <rect x="176" y="305" width="52" height="18" rx="9" fill="#C98A2C"/>
  <text class="t" x="202" y="317" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">88%</text>

  <!-- doctor review confirmation -->
  <rect x="164" y="338" width="152" height="100" rx="16" fill="#0F3D2E"/>
  <circle cx="188" cy="366" r="14" fill="#2F9E5B"/>
  <path class="tick" d="M181,366 L186,372 L196,358" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="210" y="363" font-size="9.5" font-weight="700" fill="#ffffff">Sent for review</text>
  <text class="t" x="210" y="377" font-size="8.5" fill="#9FC2AE">WhatsApp — beta</text>
  <rect x="176" y="398" width="128" height="7" rx="3.5" fill="#1F6B4E"/>
  <rect class="progress" x="176" y="398" width="128" height="7" rx="3.5" fill="#2F9E5B"/>
  <text class="t" x="176" y="424" font-size="8.5" fill="#9FC2AE">Reviewing</text>
  <text class="t" x="304" y="424" font-size="8.5" fill="#9FC2AE" text-anchor="end">Confirmed</text>

  <rect x="204" y="454" width="72" height="26" rx="13" fill="#F5EDE0"/>
  <text class="t" x="240" y="471" font-size="9.5" font-weight="700" fill="#1D5C3D" text-anchor="middle">Get treatment</text>
</g>

<!-- floating medicine capsule, lower-left -->
<g class="float d3">
  <g transform="translate(70 420) rotate(-24)">
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#0F3D2E"/>
    <rect x="-36" y="-12" width="34" height="24" rx="12" fill="#E0475A"/>
    <rect x="-2" y="-12" width="34" height="24" rx="12" fill="#ffffff"/>
  </g>
  <circle class="ring" cx="70" cy="420" r="44" fill="none" stroke="#E0475A" stroke-width="2" opacity="0.5"/>
  <circle class="ring r2" cx="70" cy="420" r="44" fill="none" stroke="#E0475A" stroke-width="2" opacity="0.5"/>
</g>

<!-- floating trust badge, lower-right -->
<g class="float d2">
  <rect x="374" y="392" width="90" height="46" rx="14" fill="#0F3D2E"/>
  <circle cx="396" cy="415" r="11" fill="#5B6EE1"/>
  <path class="tick" d="M390,415 L394,420 L403,409" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="412" y="412" font-size="8.5" font-weight="700" fill="#ffffff">Real</text>
  <text class="t" x="412" y="423" font-size="8.5" font-weight="700" fill="#ffffff">evidence</text>
</g>
</svg>
