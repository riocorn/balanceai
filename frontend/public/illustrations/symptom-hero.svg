<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 480 480"
   version="1.1"
   id="svg-symptom-hero"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs-sh">
    <linearGradient
       id="badgeGradientHero"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#0E7C86"
         id="sh-stop1" />
      <stop
         offset="1"
         stop-color="#1E6FD9"
         id="sh-stop2" />
    </linearGradient>
    <clipPath
       id="pillClipLeftHero">
      <rect
         x="245"
         y="328"
         width="45"
         height="34"
         id="sh-rect1" />
    </clipPath>
  </defs>
  <!-- decorative texture dots -->
  <circle
     cx="36"
     cy="70"
     r="4"
     fill="#ffffff"
     opacity="0.35"
     id="circle8" />
  <circle
     cx="64"
     cy="400"
     r="5"
     fill="#ffffff"
     opacity="0.3"
     id="circle10" />
  <circle
     cx="26"
     cy="250"
     r="3"
     fill="#ffffff"
     opacity="0.3"
     id="circle12" />
  <circle
     cx="446"
     cy="70"
     r="4"
     fill="#ffffff"
     opacity="0.3"
     id="circle14" />
  <circle
     cx="128"
     cy="440"
     r="4"
     fill="#ffffff"
     opacity="0.3"
     id="circle16" />
  <!-- person: head -->
  <circle
     cx="130"
     cy="150"
     r="34"
     fill="#ffffff"
     id="circle18" />
  <!-- person: torso -->
  <rect
     x="85"
     y="188"
     width="90"
     height="170"
     rx="45"
     fill="#ffffff"
     opacity="0.96"
     id="rect20" />
  <!-- person: shirt accent -->
  <rect
     x="102"
     y="210"
     width="56"
     height="96"
     rx="20"
     fill="#1E6FD9"
     id="rect22" />
  <!-- person: raised arm holding mic -->
  <path
     d="M168,220 Q206,196 224,176"
     stroke="#ffffff"
     stroke-width="26"
     stroke-linecap="round"
     fill="none"
     id="path24" />
  <!-- hand -->
  <circle
     cx="226"
     cy="176"
     r="14"
     fill="#ffffff"
     id="circle26" />
  <!-- microphone (held near mouth height) -->
  <g
     id="g40">
    <rect
       x="216"
       y="118"
       width="30"
       height="52"
       rx="15"
       fill="#0E7C86"
       id="rect28" />
    <line
       x1="223"
       y1="130"
       x2="239"
       y2="130"
       stroke="#ffffff"
       stroke-width="3"
       stroke-linecap="round"
       opacity="0.85"
       id="line30" />
    <line
       x1="223"
       y1="140"
       x2="239"
       y2="140"
       stroke="#ffffff"
       stroke-width="3"
       stroke-linecap="round"
       opacity="0.85"
       id="line32" />
    <line
       x1="223"
       y1="150"
       x2="239"
       y2="150"
       stroke="#ffffff"
       stroke-width="3"
       stroke-linecap="round"
       opacity="0.85"
       id="line34" />
    <path
       d="M209,166 Q231,182 253,166"
       stroke="#ffffff"
       stroke-width="4"
       stroke-linecap="round"
       fill="none"
       id="path36" />
    <line
