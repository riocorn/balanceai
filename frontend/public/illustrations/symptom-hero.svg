<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 480 480"
   version="1.1"
   id="svg-symptom-hero"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs-sh" />
  <style
     id="style3">
    @keyframes pulseNode { 0%, 100% { r: 6; opacity: 1; } 50% { r: 10; opacity: 0.55; } }
    .pulse-node { animation: pulseNode 1.6s ease-in-out infinite; }
    @keyframes ekgFlow { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -80; } }
    .ekg-flow { stroke-dasharray: 6 6; animation: ekgFlow 1.8s linear infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .breathe { animation: breathe 3s ease-in-out infinite; transform-origin: 350px 330px; transform-box: fill-box; }
  </style>
  <!-- faint depth circle, minimal -->
  <circle
     cx="260"
     cy="240"
     r="210"
     fill="none"
     stroke="#ffffff"
     stroke-width="1"
     stroke-dasharray="1 9"
     opacity="0.12"
     id="circle5" />
  <!-- large speech bubble: symptom description -->
  <rect
     x="24"
     y="34"
     width="192"
     height="104"
     rx="24"
     fill="none"
     stroke="#5B6EE1"
     stroke-width="6"
     id="rect7" />
  <path
     d="M64,138 L50,172 L96,138 Z"
     fill="none"
     stroke="#5B6EE1"
     stroke-width="6"
     stroke-linejoin="round"
     id="path9" />
  <line
     x1="52"
     y1="68"
     x2="188"
     y2="68"
     stroke="#ffffff"
     stroke-width="5"
     stroke-linecap="round"
     opacity="0.85"
     id="line11" />
  <line
     x1="52"
     y1="92"
     x2="150"
     y2="92"
     stroke="#ffffff"
     stroke-width="5"
     stroke-linecap="round"
     opacity="0.6"
     id="line13" />
  <line
     x1="52"
     y1="114"
     x2="170"
     y2="114"
     stroke="#ffffff"
     stroke-width="5"
     stroke-linecap="round"
     opacity="0.6"
     id="line15" />
  <!-- connector -->
  <path
     d="M216,110 Q270,120 296,170"
     stroke="#ffffff"
     stroke-width="2.5"
     stroke-dasharray="1 7"
     opacity="0.55"
     fill="none"
     id="path17" />
  <!-- big stethoscope, bold, dominant -->
  <g
     class="breathe"
     id="g35">
    <circle
       cx="384"
       cy="86"
       r="13"
       fill="#2F9E5B"
       id="circle19" />
    <circle
       cx="316"
       cy="86"
       r="13"
       fill="#2F9E5B"
       id="circle21" />
    <path
       d="M316,99 Q316,150 352,176"
       fill="none"
       stroke="#ffffff"
       stroke-width="9"
       stroke-linecap="round"
       id="path23" />
    <path
       d="M384,99 Q384,150 352,176"
       fill="none"
       stroke="#ffffff"
       stroke-width="9"
       stroke-linecap="round"
       id="path25" />
    <line
       x1="352"
       y1="176"
       x2="352"
       y2="252"
       stroke="#ffffff"
       stroke-width="9"
       stroke-linecap="round"
       id="line27" />
    <circle
       cx="352"
       cy="330"
       r="78"
       fill="none"
       stroke="#ffffff"
       stroke-width="9"
       id="circle29" />
    <circle
       cx="352"
       cy="330"
       r="34"
       fill="#E0475A"
       id="circle31" />
    <circle
       cx="352"
       cy="330"
       r="14"
       fill="#1D5C3D"
       id="circle33" />
  </g>
  <!-- bold EKG line, flowing, feeding toward the stethoscope -->
  <path
     d="M20,300 L100,300 L118,258 L142,342 L162,282 L184,300 L246,300 L266,266 L288,330 L310,300"
     fill="none"
     stroke="#E0475A"
     stroke-width="7"
     stroke-linecap="round"
     stroke-linejoin="round"
     class="ekg-flow"
     id="path37" />
  <circle
     cx="142"
     cy="342"
     r="6"
     fill="#C98A2C"
     class="pulse-node"
     id="circle39" />
  <!-- flagged / real evidence label -->
  <text
     x="20"
     y="286"
     font-family="sans-serif"
     font-size="15"
     font-weight="600"
     fill="#ffffff"
     opacity="0.85"
     id="text41">your symptoms</text>
  <!-- medicine capsule, bold, colorful -->
  <g
     transform="rotate(-26 118 410)"
     id="g47">
    <rect
       x="58"
       y="392"
       width="120"
       height="42"
       rx="21"
       fill="#E0475A"
       id="rect43" />
    <path
       d="M118,392 h60 a21,21 0 0 1 0,42 h-60 Z"
       fill="#ffffff"
       id="path45" />
  </g>
  <path
     d="M186,378 Q220,360 246,354"
     stroke="#ffffff"
     stroke-width="2.5"
     stroke-dasharray="1 7"
     opacity="0.55"
     fill="none"
     id="path49" />
  <text
     x="60"
     y="450"
     font-family="sans-serif"
     font-size="15"
     font-weight="600"
     fill="#ffffff"
     opacity="0.85"
     id="text51">real medicine</text>
  <text
     x="352"
     y="432"
     text-anchor="middle"
     font-family="sans-serif"
     font-size="15"
     font-weight="600"
     fill="#ffffff"
     opacity="0.85"
     id="text53">doctor + AI review</text>
  <circle
     cx="440"
     cy="200"
     r="3"
     fill="#ffffff"
     opacity="0.3"
     id="circle55" />
  <circle
     cx="40"
     cy="200"
     r="3"
     fill="#ffffff"
     opacity="0.25"
     id="circle57" />
</svg>
