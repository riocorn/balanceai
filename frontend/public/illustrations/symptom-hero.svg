       y1="182"
       x2="231"
       y2="196"
       stroke="#ffffff"
       stroke-width="4"
       stroke-linecap="round"
       id="line38" />
  </g>
  <!-- soundwave arcs, radiating from mic -->
  <path
     d="M258,100 Q276,132 258,166"
     stroke="#ffffff"
     stroke-width="3.4"
     stroke-linecap="round"
     fill="none"
     opacity="0.55"
     id="path42" />
  <path
     d="M274,86 Q302,132 274,180"
     stroke="#ffffff"
     stroke-width="3.4"
     stroke-linecap="round"
     fill="none"
     opacity="0.32"
     id="path44" />
  <!-- connector: mic to review badge -->
  <path
     d="M296,110 Q346,90 372,138"
     stroke="#ffffff"
     stroke-width="3"
     stroke-dasharray="2 9"
     stroke-linecap="round"
     fill="none"
     opacity="0.85"
     id="path46" />
  <!-- review badge (AI + doctor review) -->
  <circle
     cx="390"
     cy="165"
     r="46"
     fill="url(#badgeGradientHero)"
     id="circle48" />
  <path
     d="M364,167 H376 L382,147 L390,183 L396,155 H402 H416"
     fill="none"
     stroke="#ffffff"
     stroke-width="3.4"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="path50" />
  <path
     d="M405,141 V149 M401,145 H409"
     stroke="#ffffff"
     stroke-width="3.4"
     stroke-linecap="round"
     id="path52" />
  <!-- connector: badge to medicine -->
  <path
     d="M382,209 Q338,262 302,312"
     stroke="#ffffff"
     stroke-width="3"
     stroke-dasharray="2 9"
     stroke-linecap="round"
     fill="none"
     opacity="0.85"
     id="path54" />
  <!-- medicine capsule -->
  <g
     transform="rotate(-32 290 345)"
     id="g60">
    <rect
       x="245"
       y="328"
       width="90"
       height="34"
       rx="17"
       fill="#E0475A"
       id="rect56" />
    <rect
       x="245"
       y="328"
       width="90"
       height="34"
       rx="17"
       fill="#ffffff"
       clip-path="url(#pillClipLeftHero)"
       id="rect58" />
  </g>
</svg>
