<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 480 480"
   version="1.1"
   id="svg-consult-hero"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs-ch">
    <linearGradient
       id="badgeGradientConsult"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#0E7C86"
         id="ch-stop1" />
      <stop
         offset="1"
         stop-color="#1E6FD9"
         id="ch-stop2" />
    </linearGradient>
  </defs>
  <!-- decorative texture dots -->
  <circle
     cx="38"
     cy="90"
     r="4"
     fill="#ffffff"
     opacity="0.35"
     id="circle6" />
  <circle
     cx="60"
     cy="400"
     r="5"
     fill="#ffffff"
     opacity="0.3"
     id="circle8" />
  <circle
     cx="440"
     cy="80"
     r="4"
     fill="#ffffff"
     opacity="0.3"
     id="circle10" />
  <!-- patient: head -->
  <circle
     cx="118"
     cy="230"
     r="34"
     fill="#ffffff"
     id="circle12" />
  <!-- patient: torso -->
  <rect
     x="73"
     y="268"
     width="90"
     height="170"
     rx="45"
     fill="#ffffff"
     opacity="0.96"
     id="rect14" />
  <rect
     x="90"
     y="290"
     width="56"
     height="96"
     rx="20"
     fill="#1E6FD9"
     id="rect16" />
  <!-- typing/chat indicator above patient -->
  <rect
     x="82"
     y="150"
     width="76"
     height="42"
     rx="16"
     fill="#ffffff"
     id="rect18" />
  <path
     d="M100,190 L94,204 L114,190 Z"
     fill="#ffffff"
     id="path20" />
  <circle
     cx="105"
     cy="171"
     r="5.5"
     fill="#0E7C86"
     id="circle22" />
  <circle
     cx="120"
     cy="171"
     r="5.5"
     fill="#1E6FD9"
     id="circle24" />
  <circle
     cx="135"
     cy="171"
     r="5.5"
     fill="#E0475A"
     id="circle26" />
  <!-- connector: patient to consult screen -->
  <path
     d="M195,210 Q250,170 288,164"
     stroke="#ffffff"
     stroke-width="3"
     stroke-dasharray="2 9"
     stroke-linecap="round"
     fill="none"
     opacity="0.85"
     id="path28" />
  <!-- consult screen frame (WhatsApp/video call surface) -->
  <rect
     x="272"
     y="70"
     width="176"
     height="220"
     rx="20"
     fill="#ffffff"
     opacity="0.95"
     id="rect30" />
  <rect
     x="290"
     y="88"
     width="140"
     height="14"
     rx="7"
     fill="#E4EBEE"
     id="rect32" />
  <rect
     x="290"
     y="110"
     width="90"
     height="10"
     rx="5"
     fill="#E4EBEE"
     id="rect34" />
  <!-- stethoscope badge inside the screen: the "doctor" is this medical
       glyph only — deliberately not a face, matching the honest beta
       positioning (no real onboarded doctor is depicted). -->
  <circle
     cx="360"
     cy="200"
     r="52"
     fill="url(#badgeGradientConsult)"
     id="circle36" />
  <line
     x1="338"
     y1="172"
     x2="338"
     y2="186"
     stroke="#ffffff"
     stroke-width="4.2"
     stroke-linecap="round"
     id="line38" />
  <line
     x1="382"
     y1="172"
     x2="382"
     y2="186"
     stroke="#ffffff"
     stroke-width="4.2"
     stroke-linecap="round"
     id="line40" />
  <path
     d="M338,186 Q338,206 360,210 Q382,206 382,186"
     fill="none"
     stroke="#ffffff"
     stroke-width="4.2"
     stroke-linecap="round"
     id="path42" />
  <line
     x1="360"
     y1="210"
     x2="360"
     y2="228"
     stroke="#ffffff"
     stroke-width="4.2"
     stroke-linecap="round"
     id="line44" />
  <circle
     cx="360"
     cy="238"
     r="11"
     fill="#ffffff"
     id="circle46" />
  <circle
     cx="360"
     cy="238"
     r="5"
     fill="#0E7C86"
     id="circle48" />
  <!-- beta tag on the screen -->
  <rect
     x="290"
     y="256"
     width="66"
     height="22"
     rx="11"
     fill="rgba(14,124,134,0.12)"
     id="rect50" />
  <text
     x="323"
     y="271"
     text-anchor="middle"
     font-family="sans-serif"
     font-size="11"
     font-weight="700"
     fill="#0E7C86"
     id="text52">BETA</text>
  <!-- connector: screen down to confirmed capsule -->
  <path
     d="M330,300 Q290,352 258,392"
     stroke="#ffffff"
     stroke-width="3"
     stroke-dasharray="2 9"
     stroke-linecap="round"
     fill="none"
     opacity="0.85"
     id="path54" />
  <!-- confirmed check -->
  <circle
     cx="238"
     cy="410"
     r="26"
     fill="#1FAE7A"
     id="circle56" />
  <path
     d="M226,410 L235,419 L252,398"
     fill="none"
     stroke="#ffffff"
     stroke-width="5"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="path58" />
</svg>
