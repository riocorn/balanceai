<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 480 540" xmlns="http://www.w3.org/2000/svg" id="svg-wellness-hero">
<title>Balanced nutrition and health, animated</title>
<style>
.float{animation:bob 5s ease-in-out infinite}
.float.d1{animation-delay:-1.2s}.float.d2{animation-delay:-2.4s}.float.d3{animation-delay:-3.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.rock{transform-box:fill-box;transform-origin:240px 300px;animation:rock 4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.tick{stroke-dasharray:26;stroke-dashoffset:26;animation:tick 3s ease-in-out infinite}
@keyframes tick{0%,10%{stroke-dashoffset:26}30%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:26}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.t{font-family:sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tick{stroke-dashoffset:0}}
</style>

<path d="M240 40 C 360 30 450 130 445 260 C 440 400 350 480 235 478 C 120 476 40 390 45 255 C 50 130 130 50 240 40 Z" fill="#ffffff" opacity="0.05"/>

<g stroke-linecap="round" fill="none">
  <g class="twinkle" stroke="#ffffff" stroke-width="3" opacity="0.5"><path d="M36 120 H52 M44 112 V128"/></g>
  <g class="twinkle" stroke="#C98A2C" stroke-width="3" style="animation-delay:-1s"><path d="M420 90 H436 M428 82 V98"/></g>
  <g class="twinkle" stroke="#ffffff" stroke-width="3" opacity="0.4" style="animation-delay:-2s"><path d="M30 440 H46 M38 432 V448"/></g>
</g>

<!-- sun badge, upper-left -->
<g class="float d1">
  <circle cx="86" cy="110" r="46" fill="#0F3D2E"/>
  <g class="spin">
    <circle cx="86" cy="110" r="16" fill="none" stroke="#C98A2C" stroke-width="5"/>
    <g stroke="#C98A2C" stroke-width="4" stroke-linecap="round">
      <line x1="86" y1="82" x2="86" y2="90"/>
      <line x1="86" y1="130" x2="86" y2="138"/>
      <line x1="58" y1="110" x2="66" y2="110"/>
      <line x1="106" y1="110" x2="114" y2="110"/>
    </g>
  </g>
</g>

<!-- category badge, upper-right -->
<g class="float d2">
  <circle cx="404" cy="108" r="50" fill="#0F3D2E"/>
  <path d="M404,88 C 388,88 384,102 392,110 C 384,118 388,132 404,132 C 420,132 424,118 416,110 C 424,102 420,88 404,88 Z" fill="#7C5CBF"/>
</g>

<!-- phone mockup: the real wellness catalog -->
<g class="float">
  <rect x="140" y="150" width="200" height="360" rx="34" fill="#0F3D2E"/>
  <rect x="150" y="162" width="180" height="336" rx="24" fill="#ffffff"/>
  <rect x="216" y="168" width="48" height="7" rx="3.5" fill="#0F3D2E"/>

  <text class="t" x="176" y="196" font-size="11" font-weight="700" fill="#1D5C3D">Wellness</text>

  <rect x="164" y="208" width="70" height="70" rx="12" fill="#F1F9F5"/>
  <path d="M199,222 Q216,230 212,254 Q192,250 190,230 Q192,224 199,222 Z" fill="#2F9E5B"/>
  <text class="t" x="199" y="270" font-size="8" fill="#5B7480" text-anchor="middle">Vitamins</text>

  <rect x="246" y="208" width="70" height="70" rx="12" fill="#F1F9F5"/>
  <path d="M281,222 C 274,214 260,218 260,232 C 260,244 281,258 281,258 C 281,258 302,244 302,232 C 302,218 288,214 281,222 Z" fill="#E0475A"/>
  <text class="t" x="281" y="270" font-size="8" fill="#5B7480" text-anchor="middle">Women's health</text>

  <rect x="164" y="290" width="152" height="66" rx="14" fill="#F1F9F5"/>
  <text class="t" x="176" y="310" font-size="9.5" font-weight="700" fill="#1D5C3D">Real products only</text>
  <text class="t" x="176" y="324" font-size="8.5" fill="#5B7480">No fake "boosting" claims</text>
  <rect x="176" y="336" width="128" height="6" rx="3" fill="#DCECE0"/>

  <!-- balance scale, gently rocking -->
  <g class="rock">
    <line x1="240" y1="386" x2="240" y2="440" stroke="#1D5C3D" stroke-width="4"/>
    <circle cx="240" cy="444" r="5" fill="none" stroke="#1D5C3D" stroke-width="3"/>
    <line x1="204" y1="386" x2="276" y2="386" stroke="#1D5C3D" stroke-width="4" stroke-linecap="round"/>
    <path d="M198,388 Q216,400 234,388" fill="none" stroke="#1D5C3D" stroke-width="2.5"/>
    <path d="M246,388 Q264,400 282,388" fill="none" stroke="#1D5C3D" stroke-width="2.5"/>
    <path d="M212,368 Q224,372 220,386 Q206,384 204,372 Q206,368 212,368 Z" fill="#2F9E5B"/>
    <path d="M260,364 C 256,360 248,362 248,370 C 248,376 260,384 260,384 C 260,384 272,376 272,370 C 272,362 264,360 260,364 Z" fill="#E0475A"/>
  </g>
  <text class="t" x="240" y="470" font-size="9" font-weight="700" fill="#1D5C3D" text-anchor="middle">Nutrition + health, balanced</text>
</g>

<!-- floating checkmark badge, lower-left -->
<g class="float d3">
  <circle cx="70" cy="420" r="40" fill="#0F3D2E"/>
  <circle cx="70" cy="420" r="16" fill="#2F9E5B" class="pulse"/>
  <path class="tick" d="M62,420 L68,427 L80,410" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- floating "preventive" badge, lower-right -->
<g class="float d2">
  <rect x="374" y="392" width="90" height="46" rx="14" fill="#0F3D2E"/>
  <circle cx="396" cy="415" r="11" fill="#5B6EE1"/>
  <path class="tick" d="M390,415 L394,420 L403,409" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="412" y="412" font-size="8.5" font-weight="700" fill="#ffffff">Real</text>
  <text class="t" x="412" y="423" font-size="8.5" font-weight="700" fill="#ffffff">preventive</text>
</g>
</svg>
