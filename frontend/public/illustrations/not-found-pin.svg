<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 200 200"
   version="1.1"
   id="svg-not-found-pin"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs-nf">
    <linearGradient
       id="badgeGradientNF"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#0E7C86"
         id="nf-stop1" />
      <stop
         offset="1"
         stop-color="#1E6FD9"
         id="nf-stop2" />
    </linearGradient>
  </defs>
  <!-- decorative dots -->
  <circle
     cx="24"
     cy="30"
     r="3.5"
     fill="#ffffff"
     opacity="0.3"
     id="nf-dot1" />
  <circle
     cx="178"
     cy="24"
     r="3"
     fill="#ffffff"
     opacity="0.32"
     id="nf-dot2" />
  <circle
     cx="184"
     cy="168"
     r="3.5"
     fill="#ffffff"
     opacity="0.3"
     id="nf-dot3" />
  <circle
     cx="18"
     cy="150"
     r="3"
     fill="#ffffff"
     opacity="0.3"
     id="nf-dot4" />
  <!-- broken-path ring around the pin, single accent color -->
  <circle
     cx="100"
     cy="66"
     r="46"
     fill="none"
     stroke="#C98A2C"
     stroke-width="3"
     stroke-dasharray="3 10"
     stroke-linecap="round"
     opacity="0.55"
     id="nf-ring" />
  <!-- fork paths, diverging from the pin toward the two ways back -->
  <path
     d="M 78 96 C 60 118, 46 130, 34 150"
     fill="none"
     stroke="#0A5259"
     stroke-width="3"
     stroke-linecap="round"
     stroke-dasharray="2 9"
     opacity="0.6"
     id="nf-path-left" />
  <path
     d="M 122 96 C 140 118, 154 130, 166 150"
     fill="none"
     stroke="#0A5259"
     stroke-width="3"
     stroke-linecap="round"
     stroke-dasharray="2 9"
     opacity="0.6"
     id="nf-path-right" />
  <!-- map pin badge -->
  <path
     d="M 100 24 C 74 24, 54 44, 54 70 C 54 100, 100 138, 100 138 C 100 138, 146 100, 146 70 C 146 44, 126 24, 100 24 Z"
     fill="url(#badgeGradientNF)"
     id="nf-pin-body" />
  <circle
     cx="100"
     cy="68"
     r="18"
     fill="#ffffff"
     id="nf-pin-hole" />
  <circle
     cx="100"
     cy="68"
     r="7"
     fill="#0A5259"
     opacity="0.18"
     id="nf-pin-hole-shadow" />
  <!-- left destination: medicine capsule -->
  <g
     transform="rotate(-24 34 150)"
     id="nf-pill">
    <rect
       x="18"
       y="140"
       width="32"
       height="19"
       rx="9.5"
       fill="#ffffff"
       id="nf-pill-body" />
    <rect
       x="18"
       y="140"
       width="16"
       height="19"
       rx="9.5"
       fill="#0A5259"
       opacity="0.16"
       id="nf-pill-half" />
  </g>
  <!-- right destination: treatment / pulse marker -->
  <circle
     cx="166"
     cy="150"
     r="17"
     fill="#ffffff"
     id="nf-pulse-bg" />
  <path
     d="M 156 150 h 5 l 3 -8 l 4 14 l 3 -6 h 6"
     fill="none"
     stroke="#0A5259"
     stroke-width="2.5"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="nf-pulse-line" />
</svg>
