<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 200 200"
   version="1.1"
   id="svg-medicines-accent"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs-ma">
    <linearGradient
       id="badgeGradientMedicines"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#0E7C86"
         id="ma-stop1" />
      <stop
         offset="1"
         stop-color="#1E6FD9"
         id="ma-stop2" />
    </linearGradient>
    <clipPath
       id="pillClipMedA">
      <rect
         x="18"
         y="98"
         width="27"
         height="32"
         id="rect5" />
    </clipPath>
    <clipPath
       id="pillClipMedB">
      <rect
         x="98"
         y="18"
         width="19"
         height="46"
         id="rect8" />
    </clipPath>
  </defs>
  <circle
     cx="170"
     cy="34"
     r="4"
     fill="#ffffff"
     opacity="0.3"
     id="circle12" />
  <circle
     cx="182"
     cy="150"
     r="3.5"
     fill="#ffffff"
     opacity="0.3"
     id="circle14" />
  <!-- capsule 1 -->
  <g
     transform="rotate(-28 45 114)"
     id="g20">
    <rect
       x="18"
       y="98"
       width="54"
       height="32"
       rx="16"
       fill="#E0475A"
       id="rect16" />
    <rect
       x="18"
       y="98"
       width="54"
       height="32"
       rx="16"
       fill="#ffffff"
       clip-path="url(#pillClipMedA)"
       id="rect18" />
  </g>
  <!-- capsule 2 -->
  <g
     transform="rotate(18 107 41)"
     id="g26">
    <rect
       x="90"
       y="18"
       width="34"
       height="46"
       rx="17"
       fill="url(#badgeGradientMedicines)"
       id="rect22" />
    <rect
       x="90"
       y="18"
       width="34"
       height="46"
       rx="17"
       fill="#ffffff"
       clip-path="url(#pillClipMedB)"
       id="rect24" />
  </g>
  <!-- round tablet with score line -->
  <circle
     cx="150"
     cy="118"
     r="30"
     fill="#ffffff"
     id="circle28" />
  <line
     x1="128"
     y1="118"
     x2="172"
     y2="118"
     stroke="#E4EBEE"
     stroke-width="3"
     id="line30" />
</svg>
